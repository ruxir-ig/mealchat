[project]
name = "mealchat"
version = "0.1.0"
description = "Conversational meal-logging agent (CalorAI test task)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.8",
    "pillow>=10.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
mealchat = "mealchat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealchat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
